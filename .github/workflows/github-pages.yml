name: Github Pages
on:
  push:
    branches: [main]

defaults:
  run:
    working-directory: client

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false
  
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18' # Use Node.js 18 for Next.js 14

      - name: Install Packages
        run: npm install

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.REACT_APP_API_URL }}
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.REACT_APP_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_EMAIL_API_URL: ${{ secrets.REACT_APP_EMAIL_API_URL }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@4.1.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages 
          FOLDER: client/out
          CLEAN: true 
  
